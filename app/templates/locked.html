{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

    <div class="alert alert-warning">
        <h4>Document Locked</h4>
        <p>
            The document <strong>{{ catalogue_id }}</strong> is currently being edited by:
            <strong>{{ locked_by }}</strong>.

        </p>
    </div>

    <div class="mt-4">
        <a href="/" class="btn btn-secondary">⬅ Back to Documents</a>
    </div>
