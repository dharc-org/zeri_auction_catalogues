{% extends "base.html" %}

{% block content %}

<!-- <h1>Editing {{ catalogue_id }}</h1> -->
<div class="editor-container row">
  <div id="image-column" class="image-column col-md-5">
    <div id="image-frame" class="sticky-top" style="position: relative;">
    <img id="current-image" src="" alt="Chunk image" crossOrigin="anonymous" style="display:block;">
    <canvas id="text-overlay" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
  </div>

    <div class="zoom_controls">
    <button type="button" class="zoom-btn" onclick="zoomIn()">➕ Zoom In</button>
    <button type="button" class="zoom-btn" onclick="zoomOut()">➖ Zoom Out</button>
  </div>
  </div>

  <form id="catalogueForm" action="/save_document" method="post" class="col-md-6">
    <input type="hidden" name="catalogue_id" value="{{ catalogue_id }}">
    <input type="hidden" name="anchor" id="anchor">

    <div id="chunks-container">
      {% for ch in chunks %}
      <div id="{{ ch.anchor_id }}" class="chunk {% if ch.needs_revision %}issue{% endif %}" data-image-online="{{ ch.image_online or '' }}">
        <input type="hidden" name="image_online[]" value="{{ ch.image_online }}">
        <label>Num:</label>
        <input type="text" name="num[]" value="{{ ch.num }}"><br>
        <label>Title:</label>
        <input type="text" name="title[]" value="{{ ch.title }}"><br>
        <label>Text:</label>
        <textarea name="text[]">{{ ch.text }}</textarea>
        <div class="controls">
          <button type="button" class="btn add" onclick="addBelow(this)">Add Below</button>
          <button type="button" class="btn delete" onclick="removeChunk(this)">Delete</button>
          <button type="submit" class="btn save" onclick="setAnchor('{{ ch.anchor_id }}')">Save</button>
        </div>
      </div>
      {% endfor %}
    </div>
  </form>
</div>

<script>

  // Heartbeat every 2 minutes
  const catalogueId = "{{ catalogue_id }}";
  console.log("CatalogueID from template:", catalogueId);
  setInterval(() => {
      fetch(`/heartbeat/${catalogueId}`, { method: "POST" })
          .then(r => r.json())
          .then(data => {
              if (data.status === "locked_by_other") {
                  alert(`⚠ The lock was taken over by: ${data.owner}. Your edits may not be saved.`);
              }
          });
  }, 120000); // 120 seconds

  // Release lock when closing tab or navigating away
  window.addEventListener("beforeunload", function () {
      const url = `/release_lock/${catalogueId}`;
      navigator.sendBeacon(url);
  });

  const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;

      const id = entry.target.id;
      const tocId = "toc_" + id;

      // 🔥 re-query every time
      document.querySelectorAll(".toc-item").forEach(el =>
        el.classList.remove("active")
      );

      const activeToc = document.getElementById(tocId);
      if (activeToc) {
        activeToc.classList.add("active");
        activeToc.scrollIntoView({ block: "nearest" });
      }
    });
  },
  {
    rootMargin: "-40% 0px -50% 0px",
    threshold: 0
  }
  );

  document.querySelectorAll(".chunk").forEach(chunk => {
    observer.observe(chunk);
  });

  function rebuildSidebar() {
    const chunks = document.querySelectorAll(".chunk");
    const sidebar = document.querySelector(".sidebar");

    sidebar.innerHTML = `<h2>Table of Content</h2>`;

    chunks.forEach(chunk => {
      const anchorId = chunk.id;

      const numInput = chunk.querySelector("input[name='num[]'], input[name='num']");
      const num = numInput ? numInput.value.trim() : "";

      const needsRevision = chunk.classList.contains("issue");

      const toc = document.createElement("div");
      toc.className = `toc-item ${needsRevision ? "issue" : ""}`;
      toc.id = `toc_${anchorId}`;

      toc.innerHTML = `
        <a href="#${anchorId}">${num || "—"}</a>
        ${needsRevision ? `
          <button class="btn-resolve"
            onclick="resolveIssue('${catalogueId}', '${num}', 'toc_${anchorId}')">
            ✓
          </button>` : ""}
      `;

      sidebar.appendChild(toc);
    });

    document.querySelectorAll(".chunk").forEach(chunk => {
      observer.observe(chunk);
    });
  }


  function renumberChunks() {
      const container = document.getElementById("chunks-container");
      const chunks = Array.from(container.querySelectorAll(".chunk"));

      chunks.forEach((chunk, idx) => {
          const newId = `chunk_${idx + 1}`;
          chunk.id = newId;

          const saveBtn = chunk.querySelector(".btn.save");
          if (saveBtn)
              saveBtn.setAttribute("onclick", `setAnchor('${newId}')`);
      });

      rebuildSidebar();
  }

  function removeChunk(button) {
    const chunk = button.closest('.chunk');
    if (!chunk) return;

    // find the next chunk to set as anchor after deletion (or previous if last)
    const container = document.getElementById('chunks-container');
    const chunks = Array.from(container.querySelectorAll('.chunk'));
    const index = chunks.indexOf(chunk);

    // remove the chunk from DOM
    chunk.remove();

    // renumber remaining chunks + rebuild sidebar
    renumberChunks();

    // pick anchor: prefer the item that came after the removed one,
    // otherwise the previous, otherwise empty
    const remaining = Array.from(container.querySelectorAll('.chunk'));
    let anchorId = "";
    if (remaining.length > 0) {
      const pickIndex = Math.min(index, remaining.length - 1);
      anchorId = remaining[pickIndex].id; // new id like "chunk_3"
    }

    // set hidden anchor and submit the form so server updates CSV
    document.getElementById('anchor').value = anchorId;
    // optionally show a tiny confirmation or debounce to avoid accidental deletes
    document.getElementById('catalogueForm').submit();
  }

  function addBelow(button) {
      const current = button.closest(".chunk");
      const container = document.getElementById("chunks-container");
      const chunks = Array.from(container.querySelectorAll(".chunk"));
      const index = chunks.indexOf(current);

      // --- Neighboring image suggestions ---
      const prevImage = current.querySelector("input[name='image_online[]']").value;
      const nextChunk = chunks[index + 1];
      const nextImage = nextChunk ? nextChunk.querySelector("input[name='image_online[]']").value : null;

      const suggestions = [];
      if (prevImage) suggestions.push(prevImage);
      if (nextImage && nextImage !== prevImage) suggestions.push(nextImage);

      // Unique datalist id for this new chunk
      const datalistId = `image_suggestions_${Date.now()}`;

      // --- Create new chunk element ---
      const newChunk = document.createElement("div");
      newChunk.classList.add("chunk");

      newChunk.innerHTML = `
          <label>Num:</label><input type="text" name="num[]"><br>
          <label>Title:</label><input type="text" name="title[]"><br>
          <label>Text:</label><textarea name="text[]"></textarea><br>
          <label>Image URL:</label>
          <input type="text" name="image_online[]" list="${datalistId}" value="${prevImage || ''}" oninput="updatePreview(this)">
          <datalist id="${datalistId}">
              ${suggestions.map(s => `<option value="${s}"></option>`).join("")}
          </datalist>
          <img class="img-preview" src="${prevImage || ''}" style="max-width:100%; margin-top:5px;"><br>
          <div class="controls">
              <button type="button" class="btn add" onclick="addBelow(this)">Add Below</button>
              <button type="button" class="btn delete" onclick="removeChunk(this)">Delete</button>
              <button type="submit" class="btn save" onclick="setAnchor('${current.id}')">Save</button>
          </div>
      `;

      current.insertAdjacentElement("afterend", newChunk);

      renumberChunks();
      newChunk.scrollIntoView({ behavior: "smooth" });
  }

  // --- Live preview for image_online ---
  function updatePreview(input) {
      const img = input.closest(".chunk").querySelector(".img-preview");
      if (img) img.src = input.value;
  }


  function setAnchor(anchorId) {
      document.getElementById("anchor").value = anchorId;
  }

  document.addEventListener("input", (e) => {
      if (e.target.matches("input[name='num[]'], input[name='num']")) {
          rebuildSidebar();  // live update the sidebar titles
      }
  });

  document.addEventListener("DOMContentLoaded", renumberChunks);

  async function resolveIssue(catalogueId, num, tocId) {
  const formData = new FormData();
  formData.append("catalogue_id", catalogueId);
  formData.append("num", num);

  const res = await fetch("/resolve_inconsistency", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  if (!data.success) {
    alert("Could not resolve issue");
    return;
  }

  // 1️⃣ Update sidebar item
  const tocItem = document.getElementById(tocId);
  tocItem.classList.remove("issue");

  const btn = tocItem.querySelector(".btn-resolve");
  if (btn) btn.remove();

  // 2️⃣ Update main chunk highlight
  const anchorId = tocId.replace("toc_", "");
  const chunk = document.getElementById(anchorId);
  if (chunk) {
    chunk.classList.remove("issue");
  }
}


  document.addEventListener("DOMContentLoaded", () => {

    let chunks = document.querySelectorAll(".chunk");
    const currentImage = document.getElementById("current-image");
    let lastImage = null;
    let scrollContainer = document.querySelector('#chunks-container');
    if (!scrollContainer) scrollContainer = window;  // fallback

    // Refresh chunks after renumbering or DOM changes
    function refreshChunks() {
      chunks = document.querySelectorAll(".chunk");
    }

    // Call it once after renumberChunks runs
    refreshChunks();

    function updateImageOnScroll() {
      const scrollPosition = scrollContainer.scrollTop + 100;

      for (let ch of chunks) {
        const rect = ch.getBoundingClientRect();
        const top = rect.top + scrollContainer.scrollTop - scrollContainer.getBoundingClientRect().top;

        if (scrollPosition >= top) {
          const image = ch.dataset.imageOnline;
          console.log(image);
          if (image && image !== "nan" && image !== lastImage) {
            //currentImage.src = image;
            setImage(image);
            currentImage.alt = image;
            lastImage = image;
          }
        }
      }
    }

    // Initialize image
    if (chunks.length > 0) {
      lastImage = chunks[0].dataset.imageOnline;
      //currentImage.src = lastImage;
      setImage(lastImage);
    }

    //window.addEventListener("scroll", updateImageOnScroll);

    scrollContainer.addEventListener("scroll", updateImageOnScroll);

    document.querySelectorAll(".toc-item a").forEach(link => {
    link.addEventListener("click", () => {
        // delay is needed because the jump to the anchor happens *after* the click
        setTimeout(() => {
            updateImageOnScroll();
        }, 50);
    });
});

  });

  // Zoom
  let zoomLevel = 1;
  let translateX = 0;
  let translateY = 0;

  const img = document.getElementById("current-image");
  const frame = document.getElementById("image-frame");

  function applyTransform() {
    img.style.transform =
      `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
  }

  function zoomIn() {
    zoomLevel = Math.min(zoomLevel + 0.1, 5);
    applyTransform();
  }

  function zoomOut() {
    zoomLevel = Math.max(zoomLevel - 0.1, 0.1);

    // reset pan when zoomed out fully
    if (zoomLevel <= 1) {
      translateX = 0;
      translateY = 0;
    }

    applyTransform();
  }

  let isDragging = false;
let startX, startY;

frame.addEventListener("mousedown", (e) => {
  if (zoomLevel <= 1) return; // no panning unless zoomed

  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  frame.classList.add("dragging");
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  applyTransform();
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  frame.classList.remove("dragging");
});

frame.addEventListener("wheel", (e) => {
  e.preventDefault();

  const delta = e.deltaY * -0.001;
  const newZoom = Math.min(Math.max(zoomLevel + delta, 0.1), 5);

  if (newZoom === zoomLevel) return;

  zoomLevel = newZoom;

  if (zoomLevel <= 1) {
    translateX = 0;
    translateY = 0;
  }

  applyTransform();
});

function setImage(src) {
  const img = document.getElementById("current-image");
  img.src = src;

  // reset zoom/pan
  zoomLevel = 1;
  translateX = 0;
  translateY = 0;
  applyTransform();
}


  // Optional: zoom on mouse wheel
  //const img = document.getElementById("current-image");
  img.addEventListener("wheel", function(e){
      e.preventDefault();
      zoomLevel += e.deltaY * -0.001; // adjust sensitivity
      zoomLevel = Math.min(Math.max(0.1, zoomLevel), 5); // clamp between 0.1 and 5
      img.style.transform = `scale(${zoomLevel})`;
  });
</script>

{% endblock %}
